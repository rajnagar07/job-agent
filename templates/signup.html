<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>Sign Up | AI Job Agent</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<style>

body{

background:linear-gradient(135deg,#2563EB,#4F46E5);

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

}

.signup-card{

width:100%;

max-width:520px;

border:none;

border-radius:20px;

box-shadow:0 20px 60px rgba(0,0,0,.25);

}

.brand{

font-size:2rem;

font-weight:700;

}

</style>

</head>

<body>

<div class="card signup-card">

<div class="card-body p-5">

<div class="text-center mb-4">

<h2 class="brand">

🤖 AI Job Agent

</h2>

<p class="text-muted">

Create your account

</p>

</div>

{% with messages = get_flashed_messages() %}

{% if messages %}

<div class="alert alert-warning">

{{ messages[0] }}

</div>

{% endif %}

{% endwith %}

<form method="POST">

<div class="mb-3">

<label class="form-label">

Full Name

</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Email

</label>

<input
type="email"
name="email"
class="form-control">

</div>

<div class="text-center my-2">

<strong>OR</strong>

</div>

<div class="mb-3">

<label class="form-label">

Phone Number

</label>

<input
type="text"
name="phone"
class="form-control">

</div>

<div class="mb-4">

<label class="form-label">

Password

</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<button
class="btn btn-success w-100">

<i class="bi bi-person-plus"></i>

Create Account

</button>

</form>

<hr>

<div class="text-center">

Already have an account?

<a href="{{ url_for('auth.login') }}">

Login

</a>

</div>

</div>

</div>

</body>

</html>
