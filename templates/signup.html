{% extends "base.html" %}
{% block title %}Sign up · AI Job Agent{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card" style="max-width:480px;">
    <div class="auth-head">
      <div class="brand"><span class="dot"></span>job_agent()</div>
      <h2>Create your account</h2>
      <p>Save your resume once, match it against every job after.</p>
    </div>

    <form method="POST">
      <div style="margin-bottom:16px;">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" class="field" placeholder="Jordan Lee" required>
      </div>

      <div style="margin-bottom:6px;">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="field" placeholder="you@example.com">
      </div>

      <div class="auth-divider">or</div>

      <div style="margin-bottom:16px;">
        <label for="phone">Phone number</label>
        <input type="text" id="phone" name="phone" class="field" placeholder="+91 98765 43210">
      </div>

      <div style="margin-bottom:6px;">
        <label for="signup-password">Password</label>
        <div class="input-group">
          <input type="password" id="signup-password" name="password" class="field" placeholder="At least 8 characters" required>
          <button type="button" class="input-toggle" data-target="#signup-password">Show</button>
        </div>
      </div>

      <button class="btn btn-primary btn-block btn-lg" type="submit" style="margin-top:22px;">Create account</button>
    </form>

    <div class="auth-foot">
      Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
