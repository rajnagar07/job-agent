{% extends "base.html" %}
{% block title %}Reset password · AI Job Agent{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <div class="brand"><span class="dot"></span>job_agent()</div>
      <h2>Reset password</h2>
      <p>Choose a new password for your account.</p>
    </div>

    <form method="POST">
      <div style="margin-bottom:16px;">
        <label for="password">New password</label>
        <div class="input-group">
          <input type="password" id="password" name="password" class="field" placeholder="At least 8 characters" required>
          <button type="button" class="input-toggle" data-target="#password,#confirm">Show</button>
        </div>
      </div>

      <div style="margin-bottom:20px;">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm_password" class="field" placeholder="Re-enter password" required>
      </div>

      <button class="btn btn-primary btn-block btn-lg" type="submit">Update password</button>
    </form>

    <div class="auth-foot">
      <a href="{{ url_for('auth.login') }}">← Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
