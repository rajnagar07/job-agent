{% extends "base.html" %}
{% block title %}Forgot password · AI Job Agent{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <div class="brand"><span class="dot"></span>job_agent()</div>
      <h2>Forgot password</h2>
      <p>Enter your email address to receive a reset link.</p>
    </div>

    <form method="POST">
      <div style="margin-bottom:20px;">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="field" placeholder="you@example.com" required>
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Send reset link</button>
    </form>

    <div class="auth-foot">
      <a href="{{ url_for('auth.login') }}">← Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
