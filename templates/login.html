{% extends "base.html" %}
{% block title %}Login · AI Job Agent{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <div class="brand"><span class="dot"></span>job_agent()</div>
      <h2>Welcome back</h2>
      <p>Log in to see your saved matches.</p>
    </div>

    <form method="POST">
      <div class="mb-3" style="margin-bottom:16px;">
        <label for="username">Email or phone</label>
        <input type="text" id="username" name="username" class="field" placeholder="you@example.com" required>
      </div>

      <div style="margin-bottom:10px;">
        <label for="password">Password</label>
        <div class="input-group">
          <input type="password" id="password" name="password" class="field" placeholder="••••••••" required>
          <button type="button" class="input-toggle" data-target="#password">Show</button>
        </div>
      </div>

      <div class="auth-links">
        <a href="{{ url_for('auth.resend_verification') }}">Resend verification email</a>
        <a href="{{ url_for('auth.forgot_password_route') }}">Forgot password?</a>
      </div>

      <button class="btn btn-primary btn-block btn-lg" type="submit" style="margin-top:22px;">Log in</button>
    </form>

    <div class="auth-divider">or</div>

    <div class="auth-foot">
      Don't have an account? <a href="{{ url_for('auth.signup') }}">Create one</a>
    </div>
  </div>
</div>
{% endblock %}
